name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract the changelog section of this version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)"
          $match = [regex]::Match($text, $pattern)
          if (-not $match.Success) {
            Write-Error "CHANGELOG.md has no section for version $version"
            exit 1
          }
          Set-Content -Path release-notes.md -Value $match.Groups[1].Value.Trim()

      - name: Build the archive
        run: git archive --format=zip --prefix=superset-period-compare-${{ github.ref_name }}/ -o superset-period-compare-${{ github.ref_name }}.zip HEAD

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "superset-period-compare-${{ github.ref_name }}.zip" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md
